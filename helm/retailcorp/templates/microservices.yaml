{{- range $name, $config := .Values.microservices }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name | kebabcase }}
  labels:
    app: {{ $name | kebabcase }}
    tier: backend
    {{- include "retailcorp.labels" $ | nindent 4 }}
spec:
  replicas: {{ $config.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: {{ $name | kebabcase }}
  template:
    metadata:
      labels:
        app: {{ $name | kebabcase }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ $config.port | quote }}
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: {{ $name | kebabcase }}
          image: "{{ $.Values.global.imageRegistry }}/retailcorp-{{ $name | kebabcase }}:{{ $.Values.apiGateway.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ $config.port }}
              name: http
          env:
            - name: PORT
              value: {{ $config.port | quote }}
            - name: NODE_ENV
              value: {{ $.Values.global.environment | quote }}
            - name: RABBITMQ_URL
              value: "amqp://guest:guest@rabbitmq:5672"
            - name: REDIS_HOST
              value: "redis"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: database-url
                  optional: true
          resources:
            {{- toYaml $config.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ $config.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ $config.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name | kebabcase }}
  labels:
    app: {{ $name | kebabcase }}
spec:
  type: ClusterIP
  ports:
    - port: {{ $config.port }}
      targetPort: {{ $config.port }}
      name: http
  selector:
    app: {{ $name | kebabcase }}
{{- end }}
