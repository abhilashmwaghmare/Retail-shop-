upstream api_gateway {
    server api-gateway:8000;
}

upstream grafana_upstream {
    server grafana:3000;
}

upstream prometheus_upstream {
    server prometheus:9090;
}

upstream alertmanager_upstream {
    server alertmanager:9093;
}

upstream rabbitmq_upstream {
    server rabbitmq:15672;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Frontend Storefront SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Gateway Ingress (Includes /api/mesh/health, /api/products, /api/orders, etc.)
    location /api/ {
        proxy_pass http://api_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Direct Health Probes
    location /healthz {
        proxy_pass http://api_gateway/healthz;
    }

    location /ready {
        proxy_pass http://api_gateway/ready;
    }

    location /metrics {
        proxy_pass http://api_gateway/metrics;
    }

    # Grafana Dashboard over Port 80 (No custom AWS port required!)
    location = /grafana {
        return 301 /grafana/;
    }
    location /grafana/ {
        proxy_pass http://grafana_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Prometheus UI over Port 80 (No custom AWS port required!)
    location = /prometheus {
        return 301 /prometheus/;
    }
    location /prometheus/ {
        proxy_pass http://prometheus_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Alertmanager UI over Port 80 (No custom AWS port required!)
    location = /alertmanager {
        return 301 /alertmanager/;
    }
    location /alertmanager/ {
        proxy_pass http://alertmanager_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # RabbitMQ Management Web UI over Port 80
    location = /rabbitmq {
        return 301 /rabbitmq/;
    }
    location /rabbitmq/ {
        proxy_pass http://rabbitmq_upstream/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
