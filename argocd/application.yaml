apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: retailcorp-production
  namespace: argocd
  labels:
    environment: production
    app.kubernetes.io/part-of: retailcorp
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/retailcorp/ecommerce-devops-project.git
    targetRevision: main
    path: helm/retailcorp
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: retailcorp-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
