# =============================================================================
# SonarQube Scanner Configuration: RetailCorp E-Commerce Platform
# =============================================================================

sonar.projectKey=retailcorp-ecommerce-platform
sonar.projectName=RetailCorp E-Commerce Cloud Platform
sonar.projectVersion=1.0.0

# Source Paths
sonar.sources=backend/src,frontend/src
sonar.tests=tests/unit
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.spec.ts,**/*.test.js
sonar.test.inclusions=tests/unit/**/*.test.js

# Quality Gate Thresholds
# Code coverage target: >= 80%
# Maintainability rating: A
# Reliability rating: A
# Security rating: A
# Security hotspots reviewed: 100%
# Duplicated lines density: < 3%
